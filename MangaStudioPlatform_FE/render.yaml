services:
  - type: web
    name: mangastudio-fe
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://mangaproductionplatform-be.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
